syntax = "proto3";

package logpose.v2;

// Errors
//
// A failed RPC returns a status whose code is the canonical LogPose error code, the same
// name the REST API returns in `code`. The `grpc-status-details-bin` trailer carries a
// `google.rpc.Status` whose details hold a `google.rpc.ErrorInfo` (a stable `reason` such
// as `NOT_OWNER`, domain `logpose`, and `metadata` with the error's structured fields such
// as `owner_node`), a `google.rpc.BadRequest` when the error names request fields such as
// `records[2].price`, and a `google.rpc.RetryInfo` when retrying is expected to help.
//
// A retry hint is also sent as the ASCII trailer `retry-after-ms`. Not-owner and not-leader
// are `UNAVAILABLE`. A request message larger than `limits.max_grpc_message_bytes` is
// `RESOURCE_EXHAUSTED` with reason `TOO_LARGE`.
//
// Database selector
//
// Every database-scoped request names its database in `database_name`, and every
// collection-scoped request names its collection in `database_name` and `collection_name`.
// Both are required: an empty name is `INVALID_ARGUMENT`. There is no implicit default
// database; the built-in database is named `default`.
service LogPoseService {
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataReply);
  rpc GetRuntimeStatus(GetRuntimeStatusRequest) returns (GetRuntimeStatusReply);

  rpc PutDatabase(PutDatabaseRequest) returns (DatabaseDescriptorReply);
  rpc GetDatabase(GetDatabaseRequest) returns (DatabaseDescriptorReply);
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesReply);
  // Drop an empty database and its access policy. The default database cannot be dropped,
  // and a database that still holds a collection is FAILED_PRECONDITION.
  rpc DropDatabase(DropDatabaseRequest) returns (DropDatabaseReply);
  rpc PutDatabasePolicy(PutDatabasePolicyRequest) returns (DatabaseAccessPolicyReply);
  rpc GetDatabasePolicy(GetDatabasePolicyRequest) returns (DatabaseAccessPolicyReply);

  rpc CreateCollection(CreateCollectionRequest) returns (CollectionReply);
  rpc GetCollection(GetCollectionRequest) returns (CollectionReply);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsReply);
  // Change a collection's schema online: add, drop, or rename one field. Returns the
  // collection with its new schema.
  rpc AlterCollection(AlterCollectionRequest) returns (CollectionReply);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionReply);
  rpc GetCollectionPlacement(GetCollectionPlacementRequest) returns (CollectionPlacementReply);

  // Insert or replace whole records, as one atomic batch.
  rpc UpsertRecords(UpsertRecordsRequest) returns (CommitAckReply);
  // Change some fields of records, as one atomic batch: of the records `records` names by key
  // (a key without a live record fails the whole batch with NOT_FOUND), or of every live
  // record a filter matches. See UpdateRecordsRequest.
  rpc UpdateRecords(UpdateRecordsRequest) returns (CommitAckReply);
  // Delete records, as one atomic batch: by primary key (missing keys are no-ops), or every
  // live record a filter matches. See DeleteRecordsRequest.
  rpc DeleteRecords(DeleteRecordsRequest) returns (CommitAckReply);
  // Read records by primary key.
  rpc GetRecords(GetRecordsRequest) returns (GetRecordsReply);
  // Count the live records matching a filter.
  rpc CountRecords(CountRecordsRequest) returns (CountRecordsReply);
  // Page through the live records matching a filter, in one pinned snapshot.
  rpc ScrollRecords(ScrollRecordsRequest) returns (ScrollRecordsReply);
  // Stream batches of upserts into one collection. See BulkUpsertRecordsRequest.
  rpc BulkUpsertRecords(stream BulkUpsertRecordsRequest) returns (BulkUpsertRecordsReply);

  // Vector search, or a filtered scan, with a filter, an order, and a projection.
  rpc QueryCollection(QueryCollectionRequest) returns (QueryCollectionReply);
  rpc GetCollectionStats(GetCollectionStatsRequest) returns (CollectionStatsReply);
  rpc FlushCollection(FlushCollectionRequest) returns (SnapshotReply);
  rpc CompactCollection(CompactCollectionRequest) returns (SnapshotReply);
  rpc InspectCollection(InspectCollectionRequest) returns (InspectCollectionReply);
}

message GetMetadataRequest {}

message GetMetadataReply {
  string product = 1;
  string node_name = 2;
  string version = 3;
  string git_sha = 4;
  string profile = 5;
}

message GetRuntimeStatusRequest {}

enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_COMBINED = 1;
  NODE_ROLE_CONTROL = 2;
  NODE_ROLE_DATA = 3;
}

message MaintenanceBacklogReply {
  uint64 collections_with_pending = 1;
  uint64 pending_operations = 2;
  uint64 collections_in_progress = 3;
  uint64 collections_with_errors = 4;
}

message CoordinationStatusReply {
  string cluster_name = 1;
  bool membership_registered = 2;
  optional int64 membership_lease_id = 3;
  repeated string registered_members = 4;
  optional string leader_node = 5;
  bool is_local_leader = 6;
  optional int64 leadership_lease_id = 7;
  optional string last_error = 8;
}

message CollectionPlacementReply {
  string collection_id = 1;
  string collection_name = 2;
  string assigned_node = 3;
  NodeRole assigned_role = 4;
  string route_kind = 5;
  string route_reason = 6;
  string database_name = 7;
  optional string owner_node = 8;
  optional uint64 ownership_epoch = 9;
}

message GetRuntimeStatusReply {
  GetMetadataReply metadata = 1;
  NodeRole role = 2;
  string rest_endpoint = 3;
  string grpc_endpoint = 4;
  string storage_engine = 5;
  bool control_plane_ready = 6;
  bool data_plane_ready = 7;
  uint64 collection_count = 8;
  repeated CollectionPlacementReply collections = 9;
  MaintenanceBacklogReply maintenance = 10;
  optional CoordinationStatusReply coordination = 11;
}

// Databases

message DatabaseDescriptorReply {
  string database_id = 1;
  string name = 2;
  bool is_default = 3;
}

// Create the database if it does not exist; the stored descriptor is returned either way.
message PutDatabaseRequest {
  string database_name = 1;
}

message GetDatabaseRequest {
  string database_name = 1;
}

message ListDatabasesRequest {}

message ListDatabasesReply {
  repeated DatabaseDescriptorReply databases = 1;
}

message DropDatabaseRequest {
  string database_name = 1;
}

message DropDatabaseReply {
  string database_name = 1;
}

enum AuthenticationMode {
  AUTHENTICATION_MODE_UNSPECIFIED = 0;
  AUTHENTICATION_MODE_DISABLED = 1;
  AUTHENTICATION_MODE_PASSWORD = 2;
  AUTHENTICATION_MODE_MUTUAL_TLS = 3;
  AUTHENTICATION_MODE_EXTERNAL_TOKEN = 4;
}

enum DatabaseRole {
  DATABASE_ROLE_UNSPECIFIED = 0;
  DATABASE_ROLE_OWNER = 1;
  DATABASE_ROLE_READ_WRITE = 2;
  DATABASE_ROLE_READ_ONLY = 3;
}

// A principal's role in the database the policy belongs to.
message DatabaseRoleBinding {
  string principal_name = 1;
  DatabaseRole role = 2;
}

message DatabaseAccessPolicyReply {
  string database_name = 1;
  AuthenticationMode authentication_mode = 2;
  repeated DatabaseRoleBinding role_bindings = 3;
}

// Create or replace the access policy of `database_name`.
message PutDatabasePolicyRequest {
  string database_name = 1;
  AuthenticationMode authentication_mode = 2;
  repeated DatabaseRoleBinding role_bindings = 3;
}

message GetDatabasePolicyRequest {
  string database_name = 1;
}

// Collections and schemas

enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0;
  DISTANCE_METRIC_COSINE = 1;
  DISTANCE_METRIC_DOT = 2;
  DISTANCE_METRIC_L2 = 3;
}

enum PrimaryKeyType {
  PRIMARY_KEY_TYPE_UNSPECIFIED = 0;
  PRIMARY_KEY_TYPE_STRING = 1;
  PRIMARY_KEY_TYPE_INT64 = 2;
}

// Type of a scalar field. Arrays are flat, hold one element type, and cannot hold null.
enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_BOOL = 1;
  FIELD_TYPE_INT64 = 2;
  FIELD_TYPE_FLOAT64 = 3;
  FIELD_TYPE_STRING = 4;
  FIELD_TYPE_TIMESTAMP = 5;
  FIELD_TYPE_JSON = 6;
  FIELD_TYPE_ARRAY_BOOL = 7;
  FIELD_TYPE_ARRAY_INT64 = 8;
  FIELD_TYPE_ARRAY_FLOAT64 = 9;
  FIELD_TYPE_ARRAY_STRING = 10;
  FIELD_TYPE_ARRAY_TIMESTAMP = 11;
}

// Scalar index of a field. AUTO lets the engine choose from the type: INVERTED for bool,
// string, and arrays, INVERTED_AND_SORTED for numbers and timestamps, NONE for json. A
// stored schema never holds AUTO.
enum FieldIndex {
  FIELD_INDEX_AUTO = 0;
  FIELD_INDEX_NONE = 1;
  FIELD_INDEX_INVERTED = 2;
  FIELD_INDEX_SORTED = 3;
  FIELD_INDEX_INVERTED_AND_SORTED = 4;
}

message PrimaryKeySpec {
  string name = 1;
  PrimaryKeyType type = 2;
}

message VectorFieldSpec {
  string name = 1;
  // 1 to 65,536 components.
  uint32 dimensions = 2;
  // Defaults to cosine. Cosine vectors are normalized to unit length when written.
  DistanceMetric metric = 3;
}

message ScalarFieldSpec {
  string name = 1;
  FieldType type = 2;
  FieldIndex index = 3;
  // Whether records may omit the field or set it to null; defaults to true. Fields added
  // to an existing collection must be nullable.
  optional bool nullable = 4;
}

// Create a collection with a typed schema (engine plan decision D4).
message CreateCollectionRequest {
  string database_name = 1;
  string collection_name = 2;
  PrimaryKeySpec primary_key = 3;
  // At least one vector field.
  repeated VectorFieldSpec vectors = 4;
  repeated ScalarFieldSpec fields = 5;
  // Whether undeclared keys are kept in the `$extra` dynamic field; defaults to true.
  optional bool dynamic_fields = 6;
}

message PrimaryKeyField {
  uint32 id = 1;
  string name = 2;
  PrimaryKeyType type = 3;
}

message VectorField {
  uint32 id = 1;
  string name = 2;
  uint32 dimensions = 3;
  DistanceMetric metric = 4;
}

message ScalarField {
  uint32 id = 1;
  string name = 2;
  FieldType type = 3;
  FieldIndex index = 4;
  bool nullable = 5;
}

// A collection's stored schema. Field ids are stable and never reused; `schema_version`
// grows by one with every change.
message CollectionSchema {
  uint64 schema_version = 1;
  uint32 next_field_id = 2;
  PrimaryKeyField primary_key = 3;
  repeated VectorField vectors = 4;
  repeated ScalarField fields = 5;
  bool dynamic_fields = 6;
  // Names that were declared once and then dropped or renamed away. `$extra` keys under
  // these names stay hidden until a field with the name is declared again.
  repeated string retired_names = 7;
}

message RemoteBlobConfig {
  string endpoint = 1;
  string bucket = 2;
  string prefix = 3;
}

// A collection with its live schema.
message CollectionReply {
  string collection_id = 1;
  string database_name = 2;
  string name = 3;
  CollectionSchema schema = 4;
  string root_path = 5;
  uint64 flush_threshold_ops = 6;
  uint64 flush_threshold_bytes = 7;
  uint64 compaction_threshold_segments = 8;
  RemoteBlobConfig remote_blob = 9;
}

message GetCollectionRequest {
  string database_name = 1;
  string collection_name = 2;
}

message ListCollectionsRequest {
  string database_name = 1;
}

message ListCollectionsReply {
  repeated CollectionReply collections = 1;
}

message DropField {
  string name = 1;
}

message RenameField {
  string from = 1;
  string to = 2;
}

message AlterCollectionRequest {
  string database_name = 1;
  string collection_name = 2;
  oneof change {
    // Add a nullable scalar field. Rows written before it read null.
    ScalarFieldSpec add_field = 3;
    // Drop a scalar or vector field (not the primary key or the last vector field).
    DropField drop_field = 4;
    // Rename any field, including the primary key.
    RenameField rename_field = 5;
  }
}

message DropCollectionRequest {
  string database_name = 1;
  string collection_name = 2;
}

message DropCollectionReply {
  string database_name = 1;
  string collection_name = 2;
}

message GetCollectionPlacementRequest {
  string database_name = 1;
  string collection_name = 2;
}

// Typed values and records

// The single value of `NullValue`, for a null.
enum NullValue {
  NULL_VALUE = 0;
}

// A typed field value. Exactly one kind is set; a value with no kind is INVALID_ARGUMENT.
// A value must have the kind of its field's type: nothing is coerced, so an int64_value
// does not fit a float64 field.
message Value {
  oneof kind {
    NullValue null_value = 1;
    bool bool_value = 2;
    int64 int64_value = 3;
    // Finite; NaN and infinities are rejected.
    double float64_value = 4;
    string string_value = 5;
    // Microseconds since the Unix epoch, UTC, in years 0000 through 9999.
    int64 timestamp_micros = 6;
    // Elements of one kind, none null.
    ValueArray array_value = 7;
    // A `json` field's document.
    JsonValue json_value = 8;
  }
}

message ValueArray {
  repeated Value values = 1;
}

// A JSON document, for `json` fields and the `$extra` dynamic field. Integers keep their
// precision: int64_value, or uint64_value only above the int64 range.
message JsonValue {
  oneof kind {
    NullValue null_value = 1;
    bool bool_value = 2;
    int64 int64_value = 3;
    uint64 uint64_value = 4;
    // Finite; NaN and infinities are rejected.
    double float64_value = 5;
    string string_value = 6;
    JsonArray array_value = 7;
    JsonObject object_value = 8;
  }
}

message JsonArray {
  repeated JsonValue values = 1;
}

message JsonObject {
  map<string, JsonValue> fields = 1;
}

// A primary key: an int64 or a non-empty string of at most 1,024 bytes, as the schema
// declares.
message PrimaryKey {
  oneof kind {
    int64 int64_value = 1;
    string string_value = 2;
  }
}

message Vector {
  repeated float values = 1;
}

// One record of a collection.
//
// Written records must carry every vector field. `fields` holds scalar fields by name; with
// dynamic fields on, an undeclared name in `fields` is stored in `$extra` as JSON. `extra`
// holds `$extra` keys directly. A key may not appear in both, and may not be a declared or
// retired field name.
//
// Read records carry the fields the request projected: vectors, non-null scalar fields, and
// the visible `$extra` keys.
message Record {
  PrimaryKey pk = 1;
  map<string, Vector> vectors = 2;
  map<string, Value> fields = 3;
  JsonObject extra = 4;
}

// A change to some fields of one record.
//
// - `vectors`: each entry replaces that vector;
// - `fields`: each entry replaces that field, and a null_value clears it;
// - `extra`: each entry replaces that `$extra` key, and a JSON null removes it.
message RecordUpdate {
  PrimaryKey pk = 1;
  map<string, Vector> vectors = 2;
  map<string, Value> fields = 3;
  JsonObject extra = 4;
}

message UpsertRecordsRequest {
  string database_name = 1;
  string collection_name = 2;
  repeated Record records = 3;
}

// A change to some fields applied to every record a filter matches: a RecordUpdate without a
// key, with the same meaning for each entry.
message RecordPatch {
  map<string, Vector> vectors = 1;
  map<string, Value> fields = 2;
  JsonObject extra = 3;
}

// Update records by key (`records`), or every live record `filter` matches with `patch`
// (`filter` and `patch` together, without `records`).
//
// An update by filter resolves the filter once against the latest state (every earlier write
// included) and commits the matching records as one atomic batch in one WAL frame;
// `applied_ops` is the number updated, and a filter that matches nothing commits nothing. A
// match too large for one WAL frame (64 MiB) fails with RESOURCE_EXHAUSTED (reason TOO_LARGE)
// and updates nothing: narrow the filter and repeat.
message UpdateRecordsRequest {
  string database_name = 1;
  string collection_name = 2;
  repeated RecordUpdate records = 3;
  Filter filter = 4;
  // Must not name the primary key; errors name `patch.<field>`.
  RecordPatch patch = 5;
}

// Delete records by key (`keys`), or every live record `filter` matches (`filter`, without
// `keys`). A delete by filter resolves and commits like an update by filter (see
// UpdateRecordsRequest), with the same TOO_LARGE limit.
message DeleteRecordsRequest {
  string database_name = 1;
  string collection_name = 2;
  repeated PrimaryKey keys = 3;
  Filter filter = 4;
}

message GetRecordsRequest {
  string database_name = 1;
  string collection_name = 2;
  repeated PrimaryKey keys = 3;
  // Fields to return: declared field names, `$extra` for every visible dynamic key, or (with
  // dynamic fields on) single dynamic keys. The primary key is always returned. Empty
  // returns every scalar field and every visible dynamic key, but no vector field: name a
  // vector field to get it back.
  repeated string output_fields = 4;
}

message GetRecordsReply {
  string database_name = 1;
  string collection_name = 2;
  // The live records found, in request order.
  repeated Record records = 3;
  // The requested keys without a live record, in request order.
  repeated PrimaryKey missing_keys = 4;
  // The state the lookup read.
  Snapshot snapshot = 5;
}

// One batch of a BulkUpsertRecords stream.
//
// - The first message names the collection; later messages may leave `database_name` and
//   `collection_name` empty or must repeat the same values.
// - Each message is one batch, committed atomically exactly like one UpsertRecords call.
//   Batches commit in stream order, one at a time: the server reads the next message only
//   after the previous batch is committed, so HTTP/2 flow control pushes back on a client
//   that sends faster than the collection commits.
// - Each message is checked against `limits.max_grpc_message_bytes` on its own.
// - If a batch fails, the RPC fails with that batch's error and stops reading. Every earlier
//   batch is committed; the failed batch and everything after it are not. The error's
//   `ErrorInfo` metadata reports `failed_batch_index`, `committed_batches`,
//   `committed_operations`, and `last_committed_seq_no` (when a batch was committed).
// - If the client cancels or disconnects, the batch being committed (if any) still completes
//   or fails as a whole, and once the server sees the cancellation it starts no further
//   batch, even one the client sent before cancelling.
message BulkUpsertRecordsRequest {
  string database_name = 1;
  string collection_name = 2;
  repeated Record records = 3;
}

// Summary of a fully committed BulkUpsertRecords stream.
message BulkUpsertRecordsReply {
  string database_name = 1;
  string collection_name = 2;
  // Batches committed, which is every message in the stream.
  uint64 committed_batches = 3;
  // Records applied across all batches.
  uint64 applied_ops = 4;
  // Last sequence number of the last batch.
  uint64 last_seq_no = 5;
  // Snapshot that includes every batch.
  Snapshot snapshot = 6;
}

message CommitAckReply {
  string database_name = 1;
  string collection_name = 2;
  uint64 last_seq_no = 3;
  uint64 applied_ops = 4;
  Snapshot snapshot = 5;
}

message Snapshot {
  uint64 manifest_generation = 1;
  uint64 visible_seq_no = 2;
}

message SnapshotReply {
  string database_name = 1;
  string collection_name = 2;
  uint64 manifest_generation = 3;
  uint64 visible_seq_no = 4;
}

// Filters

// A boolean filter over record fields (engine plan decision D11). Exactly one node is set; an
// empty filter is INVALID_ARGUMENT.
//
// A field path is a declared field name (the primary key or a scalar field; vector fields
// cannot be filtered), `$extra.<key>` for the dynamic key `<key>`, or, with dynamic fields on,
// any other name for the dynamic key of that name. A dynamic key that the schema declares or
// retired is hidden and cannot be filtered.
//
// Operands are typed like record values of the field they compare (an array field's like one
// element); numbers convert between int64 and float64 when exact, and a float bound of an int64
// or timestamp range rounds to the matching integer range. A dynamic key or `json` field
// compares with the operand's JSON form: equality by JSON scalar equality, ranges between two
// strings or two numbers.
//
// Semantics: `eq` and `contains` hold when the field (an array field: some element) equals the
// operand, `in` and `contains_any` when it is one of the operands, `range` when it lies within
// every bound; `ne` and `not_in` hold when the field has a value and it is none of the operands,
// so null never matches them; `exists` holds when the field has a value (a dynamic key: is
// present), `is_null` when it has none (a dynamic key: is present and JSON null); `not` holds
// for every live record its child does not match, nulls included.
//
// Errors name the offending node by its path in the REST form of the filter, the same for both
// APIs: `filter.and[1].range.price.gte`, `filter.in.tags[2]`, `filter.not.exists`.
message Filter {
  oneof node {
    // Every child matches; at least one child.
    FilterList and = 1;
    // Some child matches; at least one child.
    FilterList or = 2;
    Filter not = 3;
    FieldValue eq = 4;
    FieldValue ne = 5;
    // At least one bound, and not both gt and gte (or lt and lte). Not for bool fields.
    FieldRange range = 6;
    // At least one value.
    FieldValues in = 7;
    // At least one value.
    FieldValues not_in = 8;
    // An array field only.
    FieldValue contains = 9;
    // An array field only; at least one value.
    FieldValues contains_any = 10;
    // The field path.
    string exists = 11;
    // The field path.
    string is_null = 12;
  }
}

message FilterList {
  repeated Filter filters = 1;
}

// A field path and one operand, never null.
message FieldValue {
  string field = 1;
  Value value = 2;
}

// A field path and its operands, none null.
message FieldValues {
  string field = 1;
  repeated Value values = 2;
}

// A field path and its bounds; unset bounds do not constrain.
message FieldRange {
  string field = 1;
  Value gt = 2;
  Value gte = 3;
  Value lt = 4;
  Value lte = 5;
}

enum SortDirection {
  SORT_DIRECTION_ASC = 0;
  SORT_DIRECTION_DESC = 1;
}

// Order by a declared scalar field that is not an array or json. Ties are broken by primary
// key ascending, and records without a value come last in both directions.
message OrderBy {
  string field = 1;
  SortDirection direction = 2;
}

// Counting and scrolling

// Count the live records matching `filter` (every live record without one). At most one of
// `snapshot` and `snapshot_token`, and at most one of `snapshot` and `read_barrier`.
message CountRecordsRequest {
  string database_name = 1;
  string collection_name = 2;
  Filter filter = 3;
  // Read exactly this snapshot.
  Snapshot snapshot = 4;
  // Fail with READ_BARRIER_NOT_SATISFIED unless the state read is at or past this snapshot.
  Snapshot read_barrier = 5;
  // Read the state this token pins, and extend its expiry. An expired, released, or unknown
  // token is FAILED_PRECONDITION (reason SNAPSHOT_EXPIRED); a malformed one INVALID_ARGUMENT.
  string snapshot_token = 6;
  // Pin the state counted under a token, returned in the reply, so a scroll or query can read
  // exactly that state.
  bool pin = 7;
}

message CountRecordsReply {
  string database_name = 1;
  string collection_name = 2;
  uint64 count = 3;
  // The state counted.
  Snapshot snapshot = 4;
  // The token pinning that state: set when the request pinned or named a token.
  string snapshot_token = 5;
}

// One page of the live records matching `filter`, in `order_by` order.
//
// A first page (no `cursor`) reads the current state, or the state `snapshot_token` pins. When
// records are left after the page, the server pins the state it read and returns a
// `next_cursor` that carries the pin; later pages send the same request with that cursor and
// read exactly that state, so every matching record appears exactly once across the pages
// whatever is written meanwhile. The last page has no `next_cursor`, and a scroll that fits in
// one page pins nothing.
//
// A cursor is opaque. It must be sent with the same `filter` and `order_by` as the first page
// (INVALID_ARGUMENT otherwise), and without `snapshot_token`. Its pin expires after the token
// TTL (5 minutes by default) without a page, and every page extends it; a page after it
// expired fails with FAILED_PRECONDITION (reason SNAPSHOT_EXPIRED): start over.
message ScrollRecordsRequest {
  string database_name = 1;
  string collection_name = 2;
  Filter filter = 3;
  // At most one entry; primary key ascending when empty.
  repeated OrderBy order_by = 4;
  // Records per page, 1 to 10,000; 0 is 100.
  uint32 page_size = 5;
  // Fields to return, as GetRecordsRequest projects them; empty returns every scalar field and
  // dynamic key, no vectors.
  repeated string output_fields = 6;
  string cursor = 7;
  // A first page reads the state this token pins, from a pinned count or query.
  string snapshot_token = 8;
}

message ScrollRecordsReply {
  string database_name = 1;
  string collection_name = 2;
  repeated Record records = 3;
  // The cursor of the next page; empty after the last page.
  string next_cursor = 4;
  // The state the page read; the same for every page of one scroll.
  Snapshot snapshot = 5;
}

// Queries

enum ExplainMode {
  EXPLAIN_MODE_NONE = 0;
  EXPLAIN_MODE_PLAN = 1;
  EXPLAIN_MODE_PROFILE = 2;
}

// The vector half of a query.
message VectorQuery {
  // The vector field to search; empty searches the collection's only vector field, and is
  // INVALID_ARGUMENT for a collection with several.
  string field = 1;
  // The query vector: the field's dimensions, finite components.
  repeated float values = 2;
}

// One search (engine plan decision D11): the `top_k` records nearest `vector` that match
// `filter`, or without a vector the first `top_k` records matching `filter` in `order_by` order
// (a filtered scan; ScrollRecords pages through the rest). At most one of `snapshot` and
// `snapshot_token`, and at most one of `snapshot` and `read_barrier`.
message QueryCollectionRequest {
  string database_name = 1;
  string collection_name = 2;
  VectorQuery vector = 3;
  Filter filter = 4;
  // At most one entry. With a vector it reorders the top_k hits; without one it is the scan
  // order (primary key ascending when empty).
  repeated OrderBy order_by = 5;
  // Results wanted, 1 to 10,000.
  uint64 top_k = 6;
  // Fields each hit returns, as GetRecordsRequest projects them; empty returns every scalar
  // field and dynamic key, no vectors. Name only the primary key to return keys and scores
  // alone.
  repeated string output_fields = 7;
  // Beam width of graph walks, 1 to 4,096, with a vector only; 0 uses the default (64, and at
  // least four candidates per result).
  uint32 ef = 8;
  ExplainMode explain = 9;
  // Read exactly this snapshot.
  Snapshot snapshot = 10;
  // Fail with READ_BARRIER_NOT_SATISFIED unless the state read is at or past this snapshot.
  Snapshot read_barrier = 11;
  // Read exactly the state this snapshot token pins, and extend its expiry. An expired,
  // released, or unknown token is FAILED_PRECONDITION (reason SNAPSHOT_EXPIRED); a malformed
  // one INVALID_ARGUMENT.
  string snapshot_token = 12;
  // Pin the state the query reads under a snapshot token, returned in the reply, for repeatable
  // reads. Fails with RESOURCE_EXHAUSTED (reason TOO_MANY_SNAPSHOTS) past the pin limits.
  bool pin = 13;
  // Candidates per result each segment reranks exactly in f32, 1 to 64, with a vector only; 0
  // uses the default (4).
  uint32 rerank_factor = 14;
}

// One result: the record, projected, and its score.
message QueryHit {
  Record record = 1;
  // The metric value of a vector search: similarity for cosine and dot (higher is better),
  // Euclidean distance for l2 (lower is better). Unset for a scan.
  optional float score = 2;
}

enum QueryPlanKind {
  reserved 3, 4;
  reserved "QUERY_PLAN_KIND_VECTOR_FIRST_EXACT", "QUERY_PLAN_KIND_TINY_POPULATION_EXACT_FALLBACK";
  QUERY_PLAN_KIND_UNSPECIFIED = 0;
  QUERY_PLAN_KIND_UNFILTERED_EXACT_SCAN = 1;
  QUERY_PLAN_KIND_PREDICATE_FIRST_EXACT = 2;
  QUERY_PLAN_KIND_VECTOR_FIRST_ANN = 5;
  QUERY_PLAN_KIND_COOPERATIVE_FILTERED_ANN = 6;
  QUERY_PLAN_KIND_HYBRID_EXACT_ANN_MERGE = 7;
  QUERY_PLAN_KIND_ORDERED_SCAN = 8;
}

message QueryStageTimings {
  uint64 planning_micros = 1;
  uint64 prefilter_micros = 2;
  uint64 candidate_generation_micros = 3;
  uint64 postfilter_micros = 4;
  uint64 rerank_micros = 5;
  uint64 merge_micros = 6;
}

// An operator of a query plan (EXPLAIN).
enum PlanOperator {
  PLAN_OPERATOR_UNSPECIFIED = 0;
  // One unit (segment or memtable) and its residency.
  PLAN_OPERATOR_SEGMENT_SOURCE = 1;
  // The filter compiled to the unit's bitmap of matching rows.
  PLAN_OPERATOR_BITMAP_PROBE = 2;
  // Deleted rows removed from the bitmap.
  PLAN_OPERATOR_MASK_DELETES = 3;
  // Every allowed row scored exactly (SQ8 codes or f32).
  PLAN_OPERATOR_EXACT_SCAN = 4;
  // A graph walk over the allowed rows (admit-only or ACORN-1 style).
  PLAN_OPERATOR_GRAPH_SCAN = 5;
  // The best rows of its input by distance.
  PLAN_OPERATOR_TOP_K = 6;
  // Exact f32 scores of approximate candidates.
  PLAN_OPERATOR_RERANK = 7;
  // The global heap merge of the units' results.
  PLAN_OPERATOR_MERGE = 8;
  // Rows read in a field's or the key's order (a query without a vector).
  PLAN_OPERATOR_ORDERED_SCAN = 9;
  // The final rows read and projected.
  PLAN_OPERATOR_PROJECT = 10;
}

// Work of one plan operator: estimated by the planner's cost model or counted by execution.
message PlanOperatorStats {
  // Rows the operator produces.
  uint64 rows = 1;
  // Distance computations (SQ8 or f32).
  uint64 distances = 2;
  // Graph adjacency lists read.
  uint64 hops = 3;
  // Bytes read from resident sections.
  uint64 resident_bytes = 4;
  // Bytes read from disk through the buffer cache.
  uint64 cold_bytes = 5;
  // Estimated: the cost model's price. Actual: measured time (profile mode only; 0 otherwise).
  double micros = 6;
}

// One operator of a query plan and its inputs.
message PlanNode {
  PlanOperator operator = 1;
  // Its parameters, such as `unit=0000002a` or `acorn ef=64->128`.
  string detail = 2;
  // Why the planner chose this operator (per-unit strategies); empty otherwise.
  string reason = 3;
  PlanOperatorStats estimated = 4;
  PlanOperatorStats actual = 5;
  repeated PlanNode children = 6;
}

message QueryDiagnostics {
  QueryPlanKind chosen_plan = 1;
  string planner_reason = 2;
  float estimated_selectivity = 3;
  uint64 units_considered = 4;
  uint64 units_pruned = 5;
  uint64 units_scanned = 6;
  uint64 candidates_before_filter = 7;
  uint64 candidates_after_filter = 8;
  uint64 candidates_reranked = 9;
  uint64 candidates_merged = 10;
  uint64 rerank_count = 11;
  // Why no segment walked a graph (unset when one did): each cause of the units' exact scans,
  // such as a segment without a graph yet or an exact scan priced below a walk.
  optional string fallback_reason = 12;
  map<string, uint64> unit_scan_mix = 13;
  QueryStageTimings stage_timings = 14;
  // The plan as an operator tree with estimated and actual work per operator.
  PlanNode plan = 15;
  // The plan rendered as text, one operator per line.
  string plan_text = 16;
}

message QueryCollectionReply {
  string database_name = 1;
  string collection_name = 2;
  // The vector field searched; empty for a scan.
  string vector_field = 3;
  // That field's metric; unspecified for a scan.
  DistanceMetric metric = 4;
  uint64 top_k = 5;
  uint64 returned = 6;
  // The state the query read.
  Snapshot snapshot = 7;
  // Best first (a scan: in order).
  repeated QueryHit hits = 8;
  QueryDiagnostics diagnostics = 9;
  // The token pinning the state read: set when the request pinned or named a token.
  string snapshot_token = 10;
}

// Statistics and maintenance

message GetCollectionStatsRequest {
  string database_name = 1;
  string collection_name = 2;
  Snapshot snapshot = 3;
  Snapshot read_barrier = 4;
}

message CollectionStatsReply {
  string collection_id = 1;
  string collection_name = 2;
  uint64 manifest_generation = 3;
  uint64 visible_seq_no = 4;
  uint64 mutable_op_count = 5;
  uint64 segment_count = 6;
  uint64 live_record_count = 7;
  uint64 deleted_record_count = 8;
  MaintenanceStatus maintenance = 9;
  repeated QueryUnitStats query_units = 10;
  string database_name = 11;
}

message FlushCollectionRequest {
  string database_name = 1;
  string collection_name = 2;
}

message CompactCollectionRequest {
  string database_name = 1;
  string collection_name = 2;
}

enum InspectTarget {
  INSPECT_TARGET_MANIFEST = 0;
  INSPECT_TARGET_WAL = 1;
  INSPECT_TARGET_SEGMENT = 2;
  INSPECT_TARGET_MAINTENANCE = 3;
}

message InspectCollectionRequest {
  string database_name = 1;
  string collection_name = 2;
  InspectTarget target = 3;
  string segment_id = 4;
}

// An operator diagnostic dump: `payload` is a JSON document whose shape depends on the target
// and is not a stable contract.
message InspectCollectionReply {
  string database_name = 1;
  string collection_name = 2;
  string target = 3;
  JsonValue payload = 4;
}

// Runtime maintenance state of a collection since the node opened it; nothing of it is
// persisted.
message MaintenanceStatus {
  // Jobs (`flush`, `compact`, `index`) waiting for a maintenance permit.
  repeated string pending = 1;
  // `flush` while a flush runs, otherwise `compact` while a compaction runs, otherwise `index`
  // while an index build (a segment's vector graphs) runs.
  optional string in_progress = 2;
  // The last failed job, cleared once a job of the same kind completes.
  MaintenanceError last_error = 3;
  // Flushes, compactions, and index builds that completed since the node opened the collection.
  uint64 completed_runs = 4;
}

// A failed maintenance job.
message MaintenanceError {
  // The job that failed, `flush`, `compact`, or `index`.
  string job = 1;
  // What failed.
  string message = 2;
  // When it failed, in milliseconds since the Unix epoch.
  uint64 failed_at_unix_ms = 3;
  // Jobs of this kind that failed in a row, this one included.
  uint32 consecutive_failures = 4;
}

message ScalarFieldStats {
  uint64 present_count = 1;
  uint64 null_count = 2;
  map<string, uint64> value_counts = 3;
  // The smallest and largest values as JSON scalars; unset when unknown.
  JsonValue min = 4;
  JsonValue max = 5;
  uint64 distinct_count = 6;
}

message QueryUnitArtifactStats {
  string kind = 1;
  string file_name = 2;
  uint64 approx_bytes = 3;
}

message QueryUnitStats {
  string unit_id = 1;
  string tier = 2;
  string index_kind = 3;
  uint64 min_seq_no = 4;
  uint64 max_seq_no = 5;
  uint64 put_count = 6;
  uint64 delete_count = 7;
  uint64 approx_bytes = 8;
  map<string, ScalarFieldStats> scalar_fields = 9;
  repeated QueryUnitArtifactStats artifact_stats = 10;
  map<string, uint64> component_bytes = 11;
}
