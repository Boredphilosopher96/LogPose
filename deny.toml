[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib"]

# imbl (the persistent maps and vectors behind memtables and deletion maps) and
# its chunk crate are MPL-2.0: a weak, file-level copyleft that applies only to
# modified copies of their own source files. LogPose uses them unmodified as
# ordinary dependencies, which MPL-2.0 permits in an MIT-licensed product.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "imbl"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "imbl-sized-chunks"

[advisories]
version = 2
ignore = [
  # paste is archived upstream but has no known vulnerability. It is a
  # compile-time proc-macro that pulp 0.22 (the SIMD kernels in
  # logpose-index) depends on, and no pulp release drops it yet.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro required by pulp 0.22; no vulnerability" },
]
