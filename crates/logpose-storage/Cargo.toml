[package]
name = "logpose-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
arc-swap = "1.7"
bytemuck = "1.25"
crc32c = "0.6"
imbl = "7.0"
logpose-auth = { path = "../logpose-auth" }
logpose-catalog = { path = "../logpose-catalog" }
logpose-index = { path = "../logpose-index" }
logpose-types = { path = "../logpose-types" }
logpose-vfs = { path = "../logpose-vfs" }
logpose-wal = { path = "../logpose-wal" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rayon.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }
uuid.workspace = true

[dev-dependencies]
logpose-query = { path = "../logpose-query" }
rand = "0.10.1"
