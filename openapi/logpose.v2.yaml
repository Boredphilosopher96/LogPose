---
openapi: 3.1.0
info:
  title: LogPose REST API
  version: 0.1.0
  description: >-
    Versioned REST surface for LogPose metadata, data workflows, and operator actions.
    Every database-scoped route names its database in the path, and every collection-scoped
    route names its collection below it: `/v2/databases/{database}/collections/{collection}`.
    Records are natural JSON documents keyed by field name and typed by the collection schema.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health probe
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v2/metadata:
    get:
      summary: Cluster metadata
      operationId: getMetadata
      responses:
        "200":
          description: Normalized node metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"
  /v2/runtime/status:
    get:
      summary: Get runtime status
      operationId: getRuntimeStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Control-plane runtime summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeRuntimeStatus"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases:
    get:
      summary: List databases
      operationId: listDatabases
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Database descriptors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseList"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}:
    get:
      summary: Get a database descriptor
      operationId: getDatabase
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
      responses:
        "200":
          description: Database descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseDescriptor"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      summary: Create a database
      description: "Operator only. Idempotent: an existing database is returned unchanged."
      operationId: putDatabase
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
      responses:
        "200":
          description: The database descriptor, created if it did not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseDescriptor"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      summary: Drop a database
      description: "Operator only. Deletes the database descriptor and its access policy. The default database cannot be dropped, and a database that still holds a collection is `FAILED_PRECONDITION` (409): drop its collections first."
      operationId: dropDatabase
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
      responses:
        "200":
          description: Database dropped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DroppedDatabase"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/policy:
    get:
      summary: Get a database access policy
      operationId: getDatabasePolicy
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
      responses:
        "200":
          description: Database access policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseAccessPolicy"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      summary: Create or replace a database access policy
      operationId: putDatabasePolicy
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabasePolicyRequest"
      responses:
        "200":
          description: Database access policy written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseAccessPolicy"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections:
    get:
      summary: List collections
      operationId: listCollections
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
      responses:
        "200":
          description: The collections of the database, each with its live schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionList"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      summary: Create a collection
      description: "Creates a collection with a typed schema (engine plan decision D4). Schema errors name the request field, such as `vectors[0].dimensions` or `fields[2].index`."
      operationId: createCollection
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}:
    get:
      summary: Get a collection
      operationId: getCollection
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      responses:
        "200":
          description: The collection with its live schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      summary: Change a collection schema
      description: "Applies one online schema change, ordered with the writes around it: add a nullable scalar field (rows written before it read null), drop a field, or rename a field. The name a drop or rename removes becomes retired: `$extra` keys stored under it stay hidden, and records cannot store it dynamically, until a field with the name is added again. Errors name the change field, such as `add_field.nullable` or `rename_field.to`."
      operationId: alterCollection
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaChange"
      responses:
        "200":
          description: The collection with its new schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      summary: Drop a collection
      description: "Durably removes the collection and all its data."
      operationId: dropCollection
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      responses:
        "200":
          description: Collection dropped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionContext"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/placement:
    get:
      summary: Get collection placement
      operationId: getCollectionPlacement
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      responses:
        "200":
          description: Collection placement summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionPlacement"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/records/upsert:
    post:
      summary: Upsert records
      description: "Inserts or replaces whole records as one atomic batch. Each record is a natural JSON document keyed by field name and typed by the schema. Validation errors name the record field, such as `records[2].price` or `records[0].tags[1]`."
      operationId: upsertRecords
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRecordsRequest"
      responses:
        "200":
          description: Write acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCommitAck"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/records/update:
    post:
      summary: Update records
      description: "Changes some fields of records as one atomic batch. By key (`records`): each document holds the primary key and the fields to change: a value replaces the field, `null` clears it, and vectors not sent are kept; a key without a live record fails the whole batch with `NOT_FOUND` (resource type `record`). By filter (`filter` and `patch`): the filter is resolved once against the latest state and `patch` is applied to every live record it matches, in one atomic batch; `applied_ops` is the number updated. The matching records must fit one WAL frame (64 MiB); a larger match fails with `TOO_LARGE` (413) and updates nothing."
      operationId: updateRecords
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecordsRequest"
      responses:
        "200":
          description: Write acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCommitAck"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/records/delete:
    post:
      summary: Delete records
      description: "Deletes records as one atomic batch: by primary key (`keys`; a key without a live record is a no-op), or every live record `filter` matches, resolved once against the latest state; `applied_ops` is the number deleted. The matching keys must fit one WAL frame (64 MiB); a larger match fails with `TOO_LARGE` (413) and deletes nothing."
      operationId: deleteRecords
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRecordsRequest"
      responses:
        "200":
          description: Write acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCommitAck"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/records/get:
    post:
      summary: Get records
      description: "Reads records by primary key from the current state. `output_fields` projects each record."
      operationId: getRecords
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetRecordsRequest"
      responses:
        "200":
          description: The live records found and the keys without one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionRecords"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/records/count:
    post:
      summary: Count records
      description: "Counts the live records matching `filter` (every live record without one). With `pin`, the state counted is pinned and its `snapshot_token` returned, so a scroll or query can read exactly that state."
      operationId: countRecords
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountRecordsRequest"
      responses:
        "200":
          description: The count and the state it read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCount"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/records/scroll:
    post:
      summary: Scroll records
      description: "Returns one page of the live records matching `filter`, in `order_by` order (primary key by default). A first page reads the current state, or the state `snapshot_token` pins; when records are left after it, the server pins that state and returns a `next_cursor` that carries the pin. Later pages send the same filter and order with the cursor and read exactly that state, so every matching record appears exactly once across the pages, whatever is written meanwhile. The last page has a null `next_cursor`. A cursor expires after the snapshot token TTL (5 minutes by default) without a page, and a page after that fails with `SNAPSHOT_EXPIRED` (409)."
      operationId: scrollRecords
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrollRecordsRequest"
      responses:
        "200":
          description: One page of records and the cursor of the next
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionScrollPage"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/query:
    post:
      summary: Search or scan a collection
      description: "Returns the `top_k` records nearest `vector.values` in the vector field `vector.field` that match `filter`, best first, or without a vector the first `top_k` matching records in `order_by` order (a filtered scan). `order_by` reorders the hits of a vector search. Hits are projected to `output_fields`. Filter errors name the offending node, such as `filter.and[1].range.price.gte`."
      operationId: queryCollection
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryCollectionRequest"
      responses:
        "200":
          description: Ranked query results with optional planner diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionQueryResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/stats:
    get:
      summary: Get collection stats
      operationId: getCollectionStats
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
        - name: snapshot_manifest_generation
          in: query
          required: false
          description: "Historical manifest generation to inspect. Must be provided together with `snapshot_visible_seq_no`."
          schema:
            type: integer
        - name: snapshot_visible_seq_no
          in: query
          required: false
          description: "Historical visible sequence number to inspect. Must be provided together with `snapshot_manifest_generation`."
          schema:
            type: integer
        - name: read_barrier_manifest_generation
          in: query
          required: false
          description: "Lower-bound manifest generation that must already be visible on the current owner. Must be provided together with `read_barrier_visible_seq_no`. Cannot be combined with the exact snapshot parameters. Promoted owners fail read barriers closed until replica freshness metadata exists."
          schema:
            type: integer
        - name: read_barrier_visible_seq_no
          in: query
          required: false
          description: "Lower-bound visible sequence number that must already be visible on the current owner. Must be provided together with `read_barrier_manifest_generation`. Cannot be combined with the exact snapshot parameters. Promoted owners fail read barriers closed until replica freshness metadata exists."
          schema:
            type: integer
      responses:
        "200":
          description: Collection stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionStats"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/flush:
    post:
      summary: Flush the mutable delta into a new segment
      operationId: flushCollection
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      responses:
        "200":
          description: Flush snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionSnapshot"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/compact:
    post:
      summary: Compact immutable segments
      operationId: compactCollection
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
      responses:
        "200":
          description: Compaction snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionSnapshot"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v2/databases/{database}/collections/{collection}/inspect:
    get:
      summary: Inspect collection storage state
      operationId: inspectCollection
      security:
        - bearerAuth: []
      parameters:
        - name: database
          in: path
          required: true
          description: "Database name."
          schema:
            type: string
        - name: collection
          in: path
          required: true
          description: "Collection name."
          schema:
            type: string
        - name: target
          in: query
          required: false
          schema:
            type: string
            enum: [manifest, wal, segment, maintenance]
            default: manifest
        - name: segment_id
          in: query
          required: false
          description: The segment to inspect; required when `target` is `segment`.
          schema:
            type: string
      responses:
        "200":
          description: Inspection report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionInspectReport"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  responses:
    InvalidArgument:
      description: The request is invalid (`INVALID_ARGUMENT`). `details.field_violations` names the offending fields when known.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Missing or invalid bearer token (`UNAUTHENTICATED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PermissionDenied:
      description: The principal may not perform this operation (`PERMISSION_DENIED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: A named resource does not exist (`NOT_FOUND`). `details.metadata` holds `resource_type` and `resource_name`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The resource already exists (`ALREADY_EXISTS`), or the node or collection is not in the state the request needs (`FAILED_PRECONDITION`), for example the node's role does not serve the operation, a read barrier is not visible on this node (`READ_BARRIER_NOT_SATISFIED`), an exact snapshot is no longer retained because a flush or compaction superseded its manifest generation (`SNAPSHOT_EXPIRED`), or a storage failure made the collection read-only until the engine is reopened (`COLLECTION_POISONED`). Retrying does not help.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeds `limits.max_rest_body_bytes` (`RESOURCE_EXHAUSTED`, reason `TOO_LARGE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: A limit other than a size limit is reached (`RESOURCE_EXHAUSTED`), for example the collection already pins as many snapshots as it allows, or pinned snapshots hold more retired memory than the engine allows (`TOO_MANY_SNAPSHOTS`). Release a snapshot token or retry after tokens expire.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: This node cannot serve the request now (`UNAVAILABLE`), for example it does not own the collection (`NOT_OWNER`, with `owner_node`) or it is not the control-plane leader (`NOT_LEADER`, with `leader_node`). Retry after the `Retry-After` delay, on the hinted node when one is named.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, present when a retry is expected to help.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Internal:
      description: An unexpected server failure (`INTERNAL`) or corrupt stored data (`DATA_LOSS`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    DistanceMetric:
      type: string
      enum: [cosine, dot, l2]
    MetadataResponse:
      type: object
      required: [product, node_name, version, git_sha, profile]
      properties:
        product:
          type: string
        node_name:
          type: string
        version:
          type: string
        git_sha:
          type: string
        profile:
          type: string
    NodeRole:
      type: string
      enum: [combined, control, data]
    AuthenticationMode:
      type: string
      enum: [disabled, external_token]
    DatabaseRole:
      type: string
      enum: [owner, read_write, read_only]
    DatabaseRoleBinding:
      type: object
      required:
        - database_name
        - principal_name
        - role
      properties:
        database_name:
          type: string
        principal_name:
          type: string
        role:
          $ref: "#/components/schemas/DatabaseRole"
    DatabaseAccessPolicy:
      type: object
      required:
        - database_name
        - authentication_mode
        - role_bindings
      properties:
        database_name:
          type: string
        authentication_mode:
          $ref: "#/components/schemas/AuthenticationMode"
        role_bindings:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseRoleBinding"
    CollectionPlacement:
      type: object
      required:
        - collection_id
        - database_name
        - collection_name
        - assigned_node
        - assigned_role
        - route_kind
        - route_reason
      properties:
        collection_id:
          type: string
          format: uuid
        database_name:
          type: string
        collection_name:
          type: string
        assigned_node:
          type: string
        assigned_role:
          $ref: "#/components/schemas/NodeRole"
        owner_node:
          type: [string, "null"]
        ownership_epoch:
          type: [integer, "null"]
        route_kind:
          type: string
        route_reason:
          type: string
    MaintenanceBacklog:
      type: object
      required:
        - collections_with_pending
        - pending_operations
        - collections_in_progress
        - collections_with_errors
      properties:
        collections_with_pending:
          type: integer
        pending_operations:
          type: integer
        collections_in_progress:
          type: integer
        collections_with_errors:
          type: integer
    CoordinationStatus:
      type: object
      required:
        - cluster_name
        - membership_registered
        - registered_members
        - is_local_leader
      properties:
        cluster_name:
          type: string
        membership_registered:
          type: boolean
        membership_lease_id:
          type: [integer, "null"]
          format: int64
        registered_members:
          type: array
          items:
            type: string
        leader_node:
          type: [string, "null"]
        is_local_leader:
          type: boolean
        leadership_lease_id:
          type: [integer, "null"]
          format: int64
        last_error:
          type: [string, "null"]
    NodeRuntimeStatus:
      type: object
      required:
        - metadata
        - role
        - rest_endpoint
        - grpc_endpoint
        - storage_engine
        - control_plane_ready
        - data_plane_ready
        - collection_count
        - collections
        - maintenance
      properties:
        metadata:
          $ref: "#/components/schemas/MetadataResponse"
        role:
          $ref: "#/components/schemas/NodeRole"
        rest_endpoint:
          type: string
          description: Configured REST listener address reported by the runtime.
        grpc_endpoint:
          type: string
          description: Configured gRPC listener address reported by the runtime.
        storage_engine:
          type: string
        control_plane_ready:
          type: boolean
          description: Whether control-plane coordination workflows should be considered available on this runtime.
        data_plane_ready:
          type: boolean
          description: Whether data-plane query and mutation workflows are available.
        collection_count:
          type: integer
          description: Number of collections this runtime can currently serve locally.
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CollectionPlacement"
        coordination:
          oneOf:
            - $ref: "#/components/schemas/CoordinationStatus"
            - type: "null"
        maintenance:
          $ref: "#/components/schemas/MaintenanceBacklog"
    DatabaseRoleBindingRequest:
      type: object
      additionalProperties: false
      required: [principal_name, role]
      properties:
        principal_name:
          type: string
        role:
          $ref: "#/components/schemas/DatabaseRole"
    DatabasePolicyRequest:
      type: object
      description: A database access policy. The path names the database, so the body does not.
      additionalProperties: false
      required: [authentication_mode]
      properties:
        authentication_mode:
          $ref: "#/components/schemas/AuthenticationMode"
        role_bindings:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/DatabaseRoleBindingRequest"
    DatabaseList:
      type: object
      required: [databases]
      properties:
        databases:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseDescriptor"
    DroppedDatabase:
      type: object
      required: [database_name]
      properties:
        database_name:
          type: string
    PrimaryKeyType:
      type: string
      enum: [string, int64]
    FieldType:
      type: string
      description: A scalar field type. Arrays are flat, hold one element type, and cannot hold null. `timestamp` values are RFC 3339 strings, or integer microseconds since the Unix epoch, in years 0000 through 9999; reads return RFC 3339 in UTC.
      enum:
        - bool
        - int64
        - float64
        - string
        - timestamp
        - json
        - array<bool>
        - array<int64>
        - array<float64>
        - array<string>
        - array<timestamp>
    FieldIndex:
      type: string
      description: Scalar index. `auto` picks `inverted` for bool, string, and arrays, `inverted_and_sorted` for numbers and timestamps, and `none` for json; a stored schema never holds `auto`.
      enum: [auto, none, inverted, sorted, inverted_and_sorted]
    FieldName:
      type: string
      description: "A declared field name: `[A-Za-z_][A-Za-z0-9_]{0,63}`, unique across the collection. `$extra` is reserved."
    PrimaryKeySpec:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          $ref: "#/components/schemas/FieldName"
        type:
          $ref: "#/components/schemas/PrimaryKeyType"
    VectorFieldSpec:
      type: object
      additionalProperties: false
      required: [name, dimensions]
      properties:
        name:
          $ref: "#/components/schemas/FieldName"
        dimensions:
          type: integer
          minimum: 1
          maximum: 65536
        metric:
          $ref: "#/components/schemas/DistanceMetric"
    ScalarFieldSpec:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          $ref: "#/components/schemas/FieldName"
        type:
          $ref: "#/components/schemas/FieldType"
        index:
          $ref: "#/components/schemas/FieldIndex"
        nullable:
          type: boolean
          default: true
          description: Whether records may omit the field or set it to null. Fields added to an existing collection must be nullable.
    CreateCollectionRequest:
      type: object
      description: "A typed schema (engine plan decision D4): one primary key, at least one vector field, typed scalar fields, and the `$extra` dynamic field for undeclared keys. Unknown keys are rejected."
      additionalProperties: false
      required: [name, primary_key, vectors]
      properties:
        name:
          type: string
          description: Collection name, unique in its database.
        primary_key:
          $ref: "#/components/schemas/PrimaryKeySpec"
        vectors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VectorFieldSpec"
        fields:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/ScalarFieldSpec"
        dynamic_fields:
          type: boolean
          default: true
          description: Whether undeclared keys are kept in the `$extra` dynamic field. When false, an undeclared key is rejected.
    PrimaryKeyField:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: integer
          description: Stable field id; never reused.
        name:
          type: string
        type:
          $ref: "#/components/schemas/PrimaryKeyType"
    VectorField:
      type: object
      required: [id, name, dimensions, metric]
      properties:
        id:
          type: integer
        name:
          type: string
        dimensions:
          type: integer
        metric:
          $ref: "#/components/schemas/DistanceMetric"
    ScalarField:
      type: object
      required: [id, name, type, index, nullable]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          $ref: "#/components/schemas/FieldType"
        index:
          $ref: "#/components/schemas/FieldIndex"
        nullable:
          type: boolean
    CollectionSchema:
      type: object
      required:
        - schema_version
        - next_field_id
        - primary_key
        - vectors
        - fields
        - dynamic_fields
        - retired_names
      properties:
        schema_version:
          type: integer
          description: Grows by one with every schema change; a new collection starts at 1.
        next_field_id:
          type: integer
          description: The id the next added field receives.
        primary_key:
          $ref: "#/components/schemas/PrimaryKeyField"
        vectors:
          type: array
          items:
            $ref: "#/components/schemas/VectorField"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ScalarField"
        dynamic_fields:
          type: boolean
        retired_names:
          type: array
          description: Names declared once and then dropped or renamed away. `$extra` keys under these names stay hidden until a field with the name is declared again.
          items:
            type: string
    Collection:
      type: object
      description: A collection with its live schema.
      required:
        - collection_id
        - database_name
        - name
        - schema
        - root_path
        - remote_blob
        - flush_threshold_ops
        - flush_threshold_bytes
        - compaction_threshold_segments
      properties:
        collection_id:
          type: string
          format: uuid
        database_name:
          type: string
        name:
          type: string
        schema:
          $ref: "#/components/schemas/CollectionSchema"
        root_path:
          type: string
        remote_blob:
          oneOf:
            - type: "null"
            - type: object
              required: [endpoint, bucket, prefix]
              properties:
                endpoint:
                  type: string
                bucket:
                  type: string
                prefix:
                  type: string
        flush_threshold_ops:
          type: integer
        flush_threshold_bytes:
          type: integer
        compaction_threshold_segments:
          type: integer
          description: Segments of one size tier that start a background compaction merging them. The maximum value turns background compaction off.
    CollectionList:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
    SchemaChange:
      description: One online schema change, as an object with exactly one key.
      oneOf:
        - type: object
          additionalProperties: false
          required: [add_field]
          properties:
            add_field:
              $ref: "#/components/schemas/ScalarFieldSpec"
        - type: object
          additionalProperties: false
          required: [drop_field]
          properties:
            drop_field:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
        - type: object
          additionalProperties: false
          required: [rename_field]
          properties:
            rename_field:
              type: object
              additionalProperties: false
              required: [from, to]
              properties:
                from:
                  type: string
                to:
                  type: string
    PrimaryKey:
      description: A primary key, typed by the schema.
      oneOf:
        - type: integer
          format: int64
        - type: string
          minLength: 1
          maxLength: 1024
    Record:
      type: object
      description: "A natural JSON document keyed by field name: the primary key, each vector field (an array of finite numbers; cosine vectors are normalized to unit length when written), each scalar field typed by the schema, and, with dynamic fields on, any undeclared key, which is kept in `$extra` as JSON. Nothing is coerced: a string never becomes a number. `$extra` itself is reserved, and a retired name cannot be stored."
      additionalProperties: true
    UpsertRecordsRequest:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          description: Whole records; each needs its primary key, every vector field, and every non-nullable field.
          items:
            $ref: "#/components/schemas/Record"
    UpdateRecordsRequest:
      type: object
      additionalProperties: false
      description: "Either `records` (update by key), or `filter` and `patch` together (update by filter)."
      properties:
        records:
          type: array
          description: Partial documents; each holds the primary key and the fields to change. A value replaces a field and `null` clears it (or removes a dynamic key).
          items:
            $ref: "#/components/schemas/Record"
        filter:
          $ref: "#/components/schemas/Filter"
        patch:
          $ref: "#/components/schemas/RecordPatch"
    RecordPatch:
      type: object
      description: "The fields to change on every record a filter matches, as in a partial document but without the primary key: a value replaces a field, `null` clears it (or removes a dynamic key), and a vector replaces the vector. Errors name `patch.<field>`."
      additionalProperties: true
    DeleteRecordsRequest:
      type: object
      additionalProperties: false
      description: "Either `keys` (delete by key) or `filter` (delete every live record the filter matches)."
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/PrimaryKey"
        filter:
          $ref: "#/components/schemas/Filter"
    GetRecordsRequest:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/PrimaryKey"
        output_fields:
          type: array
          default: []
          description: "Fields to return: declared field names, `$extra` for every visible dynamic key, or (with dynamic fields on) single dynamic keys. The primary key is always returned. Empty returns every field."
          items:
            type: string
    RecordsResponse:
      type: object
      required: [records, missing_keys, snapshot]
      properties:
        records:
          type: array
          description: The live records found, in request order.
          items:
            $ref: "#/components/schemas/Record"
        missing_keys:
          type: array
          description: The requested keys without a live record, in request order.
          items:
            $ref: "#/components/schemas/PrimaryKey"
        snapshot:
          $ref: "#/components/schemas/Snapshot"
    CollectionRecords:
      allOf:
        - $ref: "#/components/schemas/CollectionContext"
        - $ref: "#/components/schemas/RecordsResponse"
    DatabaseDescriptor:
      type: object
      required:
        - database_id
        - name
        - is_default
      properties:
        database_id:
          type: string
          format: uuid
        name:
          type: string
        is_default:
          type: boolean
    CommitAck:
      type: object
      required: [last_seq_no, applied_ops, snapshot]
      properties:
        last_seq_no:
          type: integer
        applied_ops:
          type: integer
        snapshot:
          $ref: "#/components/schemas/Snapshot"
    Snapshot:
      type: object
      required: [manifest_generation, visible_seq_no]
      properties:
        manifest_generation:
          type: integer
        visible_seq_no:
          type: integer
    ScalarMetadataValue:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: "null"
    ExplainMode:
      type: string
      enum: [none, plan, profile]
    QueryPlanKind:
      type: string
      description: "The plan a query used, summarized over its units: `unfiltered_exact_scan` and `predicate_first_exact` when every unit was scanned exactly (without and with a filter), `vector_first_ann` when segments walked their graphs, `cooperative_filtered_ann` when they walked them under a filter (ACORN-1 style or admit-only), `hybrid_exact_ann_merge` when graph walks merged with memtable scans, and `ordered_scan` for a query without a vector. `vector_first_exact` and `tiny_population_exact_fallback` are no longer produced."
      enum:
        - unfiltered_exact_scan
        - predicate_first_exact
        - vector_first_exact
        - tiny_population_exact_fallback
        - vector_first_ann
        - cooperative_filtered_ann
        - hybrid_exact_ann_merge
        - ordered_scan
    FieldPath:
      type: string
      description: "A declared field name (the primary key or a scalar field; vector fields cannot be filtered), `$extra.<key>` for the dynamic key `<key>`, or, with dynamic fields on, any other name for the dynamic key of that name. A dynamic key the schema declares or retired is hidden and cannot be filtered."
    FilterOperand:
      description: "A value typed like a record value of the field it compares (an array field's like one element): a string, number, or boolean, or an RFC 3339 string or microseconds for a timestamp. Numbers convert between int64 and float64 when exact; a fractional bound of an int64 or timestamp range rounds to the matching integer range. A dynamic key or `json` field compares with the JSON scalar. Never null."
      oneOf:
        - type: string
        - type: number
        - type: boolean
    FieldOperand:
      type: object
      description: "One entry: the field path and its operand, such as `{\"tenant\": \"acme\"}`."
      minProperties: 1
      maxProperties: 1
      additionalProperties:
        $ref: "#/components/schemas/FilterOperand"
    FieldOperands:
      type: object
      description: "One entry: the field path and a non-empty array of operands, such as `{\"tags\": [\"a\", \"b\"]}`."
      minProperties: 1
      maxProperties: 1
      additionalProperties:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/FilterOperand"
    RangeBounds:
      type: object
      description: "At least one bound, and not both `gt` and `gte` (or `lt` and `lte`). Not for bool fields."
      additionalProperties: false
      minProperties: 1
      properties:
        gt:
          $ref: "#/components/schemas/FilterOperand"
        gte:
          $ref: "#/components/schemas/FilterOperand"
        lt:
          $ref: "#/components/schemas/FilterOperand"
        lte:
          $ref: "#/components/schemas/FilterOperand"
    Filter:
      type: object
      description: "A boolean filter over record fields (engine plan decision D11): an object with exactly one operator key. `eq` and `contains` hold when the field (an array field: some element) equals the operand, `in` and `contains_any` when it is one of the operands, `range` when it lies within every bound; `ne` and `not_in` hold when the field has a value and it is none of the operands, so null never matches them; `exists` holds when the field has a value (a dynamic key: is present), `is_null` when it has none (a dynamic key: is present and JSON null); `not` holds for every live record its child does not match, nulls included. `contains` and `contains_any` need an array field. Errors name the offending node by its path, such as `filter.and[1].range.price.gte`."
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      properties:
        and:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Filter"
        or:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Filter"
        not:
          $ref: "#/components/schemas/Filter"
        eq:
          $ref: "#/components/schemas/FieldOperand"
        ne:
          $ref: "#/components/schemas/FieldOperand"
        contains:
          $ref: "#/components/schemas/FieldOperand"
        in:
          $ref: "#/components/schemas/FieldOperands"
        not_in:
          $ref: "#/components/schemas/FieldOperands"
        contains_any:
          $ref: "#/components/schemas/FieldOperands"
        range:
          type: object
          description: "One entry: the field path and its bounds, such as `{\"price\": {\"gte\": 10, \"lt\": 50}}`."
          minProperties: 1
          maxProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/RangeBounds"
        exists:
          $ref: "#/components/schemas/FieldPath"
        is_null:
          $ref: "#/components/schemas/FieldPath"
    OrderBy:
      type: object
      description: Order by a declared scalar field that is not an array or json. Ties are broken by primary key ascending, and records without a value come last in both directions.
      additionalProperties: false
      required: [field]
      properties:
        field:
          type: string
        direction:
          type: string
          enum: [asc, desc]
          default: asc
    VectorQuery:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        field:
          description: The vector field to search; omitted searches the collection's only vector field, and is `INVALID_ARGUMENT` for a collection with several.
          oneOf:
            - type: "null"
            - type: string
        values:
          type: array
          description: The query vector, of the field's dimensions, with finite components.
          items:
            type: number
    QueryCollectionRequest:
      type: object
      additionalProperties: false
      description: "One search (engine plan decision D11): the `top_k` records nearest `vector` that match `filter`, or without a vector the first `top_k` records matching `filter` in `order_by` order (a filtered scan; `records/scroll` pages through the rest). At most one of `snapshot` and `snapshot_token`, and at most one of `snapshot` and `read_barrier`."
      required: [top_k]
      properties:
        vector:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VectorQuery"
        filter:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Filter"
        order_by:
          type: array
          maxItems: 1
          description: With a vector it reorders the `top_k` hits; without one it is the scan order (primary key ascending when empty).
          items:
            $ref: "#/components/schemas/OrderBy"
        top_k:
          type: integer
          minimum: 1
          maximum: 10000
        output_fields:
          type: array
          default: []
          description: "Fields each hit returns, as `records/get` projects them; empty returns every field, vectors included. Name only the primary key to return keys and scores alone."
          items:
            type: string
        ef:
          description: Beam width of graph walks, 1 to 4,096, with a vector only. Defaults to 64, and at least four candidates per result.
          oneOf:
            - type: "null"
            - type: integer
              minimum: 1
              maximum: 4096
        explain:
          $ref: "#/components/schemas/ExplainMode"
        snapshot:
          description: Read exactly this state. It must be the current state, one of the latest states of the current manifest generation, or a state a snapshot token pins; any other fails with `SNAPSHOT_EXPIRED`. Repeatable reads pin a token instead.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Snapshot"
        snapshot_token:
          description: Read exactly the state this snapshot token pins, and extend the token's expiry. An expired, released, or unknown token fails with `SNAPSHOT_EXPIRED` (409); a malformed one is `INVALID_ARGUMENT`.
          oneOf:
            - type: "null"
            - type: string
        pin:
          type: boolean
          default: false
          description: Pin the state the query reads under a snapshot token, returned as `snapshot_token`, for repeatable reads. Fails with `TOO_MANY_SNAPSHOTS` (429) past the pin limits.
        read_barrier:
          description: Fail with `READ_BARRIER_NOT_SATISFIED` unless the state read is at or past this snapshot.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Snapshot"
    QueryHit:
      type: object
      required: [record]
      properties:
        score:
          type: number
          description: "The metric value of a vector search: similarity for cosine and dot (higher is better), Euclidean distance for l2 (lower is better). Absent for a scan."
        record:
          $ref: "#/components/schemas/Record"
    QueryStageTimings:
      type: object
      required:
        - planning_micros
        - prefilter_micros
        - candidate_generation_micros
        - postfilter_micros
        - rerank_micros
        - merge_micros
      properties:
        planning_micros:
          type: integer
        prefilter_micros:
          type: integer
        candidate_generation_micros:
          type: integer
        postfilter_micros:
          type: integer
        rerank_micros:
          type: integer
        merge_micros:
          type: integer
    QueryDiagnostics:
      type: object
      required:
        - chosen_plan
        - planner_reason
        - estimated_selectivity
        - units_considered
        - units_pruned
        - units_scanned
        - candidates_before_filter
        - candidates_after_filter
        - candidates_reranked
        - candidates_merged
        - rerank_count
      properties:
        chosen_plan:
          $ref: "#/components/schemas/QueryPlanKind"
        planner_reason:
          type: string
        estimated_selectivity:
          type: number
        units_considered:
          type: integer
        units_pruned:
          type: integer
        units_scanned:
          type: integer
        candidates_before_filter:
          type: integer
        candidates_after_filter:
          type: integer
        candidates_reranked:
          type: integer
        candidates_merged:
          type: integer
        rerank_count:
          type: integer
        fallback_reason:
          oneOf:
            - type: "null"
            - type: string
        unit_scan_mix:
          type: object
          description: "Units per strategy: `memtable_scan`, `exact_sq8`, `exact_f32`, `graph_admit`, `graph_acorn`, `pruned` (zone maps excluded the filter), and `empty` (no live row matched)."
          additionalProperties:
            type: integer
        stage_timings:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/QueryStageTimings"
    QueryResponse:
      type: object
      required: [top_k, returned, snapshot, hits]
      properties:
        vector_field:
          type: string
          description: The vector field searched; absent for a scan.
        metric:
          $ref: "#/components/schemas/DistanceMetric"
        top_k:
          type: integer
        returned:
          type: integer
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        hits:
          type: array
          description: Best first (a scan, in order).
          items:
            $ref: "#/components/schemas/QueryHit"
        diagnostics:
          $ref: "#/components/schemas/QueryDiagnostics"
        snapshot_token:
          description: The token pinning the state read, present when the request pinned or named a token.
          type: string
    CollectionContext:
      type: object
      required: [database_name, collection_name]
      properties:
        database_name:
          type: string
        collection_name:
          type: string
    CollectionQueryResponse:
      allOf:
        - $ref: "#/components/schemas/CollectionContext"
        - $ref: "#/components/schemas/QueryResponse"
    CountRecordsRequest:
      type: object
      additionalProperties: false
      description: At most one of `snapshot` and `snapshot_token`, and at most one of `snapshot` and `read_barrier`.
      properties:
        filter:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Filter"
        snapshot:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Snapshot"
        read_barrier:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Snapshot"
        snapshot_token:
          oneOf:
            - type: "null"
            - type: string
        pin:
          type: boolean
          default: false
          description: Pin the state counted under a snapshot token, returned as `snapshot_token`, so a scroll or query can read exactly that state.
    CountRecordsResponse:
      type: object
      required: [count, snapshot]
      properties:
        count:
          type: integer
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        snapshot_token:
          type: string
    CollectionCount:
      allOf:
        - $ref: "#/components/schemas/CollectionContext"
        - $ref: "#/components/schemas/CountRecordsResponse"
    ScrollRecordsRequest:
      type: object
      additionalProperties: false
      description: "One page. A later page sends the same `filter` and `order_by` with the previous page's `next_cursor` (`INVALID_ARGUMENT` otherwise), and no `snapshot_token`."
      properties:
        filter:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Filter"
        order_by:
          type: array
          maxItems: 1
          description: Primary key ascending when empty.
          items:
            $ref: "#/components/schemas/OrderBy"
        page_size:
          description: Records per page, 1 to 10,000; 100 when omitted.
          oneOf:
            - type: "null"
            - type: integer
              minimum: 1
              maximum: 10000
        output_fields:
          type: array
          default: []
          items:
            type: string
        cursor:
          description: Continue after the page that returned this cursor. An expired cursor fails with `SNAPSHOT_EXPIRED` (409); restart the scroll.
          oneOf:
            - type: "null"
            - type: string
        snapshot_token:
          description: A first page reads the state this token pins, from a pinned count or query.
          oneOf:
            - type: "null"
            - type: string
    ScrollRecordsResponse:
      type: object
      required: [records, next_cursor, snapshot]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/Record"
        next_cursor:
          description: The cursor of the next page; null after the last page.
          oneOf:
            - type: "null"
            - type: string
        snapshot:
          $ref: "#/components/schemas/Snapshot"
    CollectionScrollPage:
      allOf:
        - $ref: "#/components/schemas/CollectionContext"
        - $ref: "#/components/schemas/ScrollRecordsResponse"
    MaintenanceStatus:
      type: object
      description: Runtime maintenance state of a collection since the node opened it; nothing of it is persisted.
      required: [pending, completed_runs]
      properties:
        pending:
          type: array
          description: Jobs (`flush`, `compact`) waiting for a maintenance permit.
          items:
            type: string
        in_progress:
          description: "`flush` while a flush runs, otherwise `compact` while a compaction runs."
          oneOf:
            - type: "null"
            - type: string
        last_error:
          description: The last failed job, cleared once a job of the same kind completes.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/MaintenanceError"
        completed_runs:
          type: integer
          description: Flushes and compactions that completed since the node opened the collection.
    MaintenanceError:
      type: object
      description: A failed maintenance job.
      required: [job, message, failed_at_unix_ms, consecutive_failures]
      properties:
        job:
          type: string
          description: The job that failed, `flush` or `compact`.
        message:
          type: string
          description: What failed.
        failed_at_unix_ms:
          type: integer
          description: When it failed, in milliseconds since the Unix epoch.
        consecutive_failures:
          type: integer
          description: Jobs of this kind that failed in a row, this one included. Once flushes fail `max_flush_failures` times in a row (or once with a full or read-only device, or corrupt data), the collection is poisoned.
    ScalarFieldStats:
      type: object
      required: [present_count, null_count, distinct_count, value_counts]
      properties:
        present_count:
          type: integer
        null_count:
          type: integer
        distinct_count:
          type: integer
        value_counts:
          type: object
          additionalProperties:
            type: integer
        min:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ScalarMetadataValue"
        max:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ScalarMetadataValue"
    QueryUnitArtifactStats:
      type: object
      required: [kind, file_name, approx_bytes]
      properties:
        kind:
          type: string
        file_name:
          type: string
        approx_bytes:
          type: integer
    QueryUnitStats:
      type: object
      required:
        - unit_id
        - tier
        - index_kind
        - min_seq_no
        - max_seq_no
        - put_count
        - delete_count
        - approx_bytes
        - scalar_fields
        - artifact_stats
        - component_bytes
      properties:
        unit_id:
          type: string
        tier:
          type: string
        index_kind:
          type: string
          description: "`raw` for the memtables; for a segment, the vector index its searches use: `hnsw` (graph over SQ8 codes), `sq8` (codes only), or `flat` (f32 only)."
        min_seq_no:
          type: integer
        max_seq_no:
          type: integer
        put_count:
          type: integer
        delete_count:
          type: integer
        approx_bytes:
          type: integer
        scalar_fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ScalarFieldStats"
        artifact_stats:
          type: array
          items:
            $ref: "#/components/schemas/QueryUnitArtifactStats"
        component_bytes:
          type: object
          additionalProperties:
            type: integer
    CollectionStats:
      type: object
      required:
        - collection_id
        - database_name
        - collection_name
        - manifest_generation
        - visible_seq_no
        - mutable_op_count
        - segment_count
        - live_record_count
        - deleted_record_count
        - maintenance
        - query_units
      properties:
        collection_id:
          type: string
          format: uuid
        database_name:
          type: string
        collection_name:
          type: string
        manifest_generation:
          type: integer
        visible_seq_no:
          type: integer
        mutable_op_count:
          type: integer
        segment_count:
          type: integer
        live_record_count:
          type: integer
        deleted_record_count:
          type: integer
        maintenance:
          $ref: "#/components/schemas/MaintenanceStatus"
        query_units:
          type: array
          items:
            $ref: "#/components/schemas/QueryUnitStats"
    InspectReport:
      type: object
      required: [target, payload]
      properties:
        target:
          type: string
        payload:
          description: Target-specific inspection payload, any JSON value (including null).
    CollectionCommitAck:
      allOf:
        - $ref: "#/components/schemas/CollectionContext"
        - $ref: "#/components/schemas/CommitAck"
    CollectionSnapshot:
      allOf:
        - $ref: "#/components/schemas/CollectionContext"
        - $ref: "#/components/schemas/Snapshot"
    CollectionInspectReport:
      allOf:
        - $ref: "#/components/schemas/CollectionContext"
        - $ref: "#/components/schemas/InspectReport"
    ErrorCode:
      type: string
      description: Canonical error class, named like the gRPC status code the gRPC API returns for the same error.
      enum:
        - INVALID_ARGUMENT
        - NOT_FOUND
        - ALREADY_EXISTS
        - FAILED_PRECONDITION
        - UNAUTHENTICATED
        - PERMISSION_DENIED
        - RESOURCE_EXHAUSTED
        - UNAVAILABLE
        - DATA_LOSS
        - INTERNAL
    ErrorReason:
      type: string
      description: Stable machine-readable reason; the same value gRPC sends in `google.rpc.ErrorInfo.reason`.
      enum:
        - INVALID_ARGUMENT
        - DIMENSION_MISMATCH
        - TOO_LARGE
        - INVALID_CONFIG
        - RESOURCE_NOT_FOUND
        - RESOURCE_ALREADY_EXISTS
        - FAILED_PRECONDITION
        - WRONG_NODE_ROLE
        - RECONCILIATION_REQUIRED
        - STORAGE_ROOT_LOCKED
        - SNAPSHOT_EXPIRED
        - TOO_MANY_SNAPSHOTS
        - WRITE_STALLED
        - UNAUTHENTICATED
        - PERMISSION_DENIED
        - NOT_OWNER
        - NOT_LEADER
        - READ_BARRIER_NOT_SATISFIED
        - UNAVAILABLE
        - DATA_CORRUPTION
        - COLLECTION_POISONED
        - WAL_WRITE_FAILED
        - IO_ERROR
        - INTERNAL
    FieldViolation:
      type: object
      required: [field, description]
      properties:
        field:
          type: string
          description: Path of the field in the request, such as `records[2].price`, `keys[0]`, or `vectors[0].dimensions`.
        description:
          type: string
    ErrorDetails:
      type: object
      required: [reason, metadata, field_violations]
      properties:
        reason:
          $ref: "#/components/schemas/ErrorReason"
        metadata:
          type: object
          description: Structured fields of the error, such as `owner_node`, `resource_type`, or `limit_bytes`. A failed bulk batch adds `failed_batch_index`, `committed_batches`, `committed_operations`, and `last_committed_seq_no`.
          additionalProperties:
            type: string
        field_violations:
          type: array
          items:
            $ref: "#/components/schemas/FieldViolation"
        retry_after_ms:
          type: integer
          minimum: 0
          description: How long to wait before retrying, present when a retry is expected to help.
    ErrorResponse:
      type: object
      required: [code, message, details]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          $ref: "#/components/schemas/ErrorDetails"
